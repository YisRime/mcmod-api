version: '3.8'

services:
  mcmod-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcmod-api
    ports:
      - "6666:6666"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6666/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
